
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timetable | School Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col">

        <div class="p-6 border-b border-slate-700">

            <h1 class="text-2xl font-bold">
                School<span class="text-blue-400">MS</span>
            </h1>

            <p class="text-xs text-slate-400 mt-1">
                Management System
            </p>

        </div>

        <nav class="flex-1 p-4 space-y-2">

            <a href="/dashboard/admin"
               class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="/students"
               class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                👨‍🎓
                <span>Students</span>
            </a>

            <a href="/timetable"
               class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600">
                🕐
                <span>Timetable</span>
            </a>

        </nav>

        <div class="p-4 border-t border-slate-700">

            <a href="/logout"
               class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-red-600 transition">

                🚪
                <span>Logout</span>

            </a>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="flex-1">

        <!-- HEADER -->
        <header class="bg-white shadow-sm px-6 py-4">

            <h2 class="text-2xl font-bold text-gray-800">
                Timetable
            </h2>

            <p class="text-sm text-gray-500 mt-1">
                Create and manage lecture schedule
            </p>

        </header>


        <section class="p-6">

            <!-- ADD LECTURE -->
            <div class="bg-white rounded-xl shadow-sm p-6">

                <h3 class="text-xl font-bold text-gray-800 mb-5">
                    Add Lecture
                </h3>

                <form id="timetableForm">

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

                        <!-- DAY -->
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                Day
                            </label>

                            <select id="day"
                                    class="w-full border rounded-lg px-4 py-3"
                                    required>

                                <option value="">Select Day</option>
                                <option>Monday</option>
                                <option>Tuesday</option>
                                <option>Wednesday</option>
                                <option>Thursday</option>
                                <option>Friday</option>
                                <option>Saturday</option>

                            </select>
                        </div>


                        <!-- START -->
                        <div>

                            <label class="block text-sm font-medium mb-2">
                                Start Time
                            </label>

                            <input type="time"
                                   id="start_time"
                                   class="w-full border rounded-lg px-4 py-3"
                                   required>

                        </div>


                        <!-- END -->
                        <div>

                            <label class="block text-sm font-medium mb-2">
                                End Time
                            </label>

                            <input type="time"
                                   id="end_time"
                                   class="w-full border rounded-lg px-4 py-3"
                                   required>

                        </div>


                        <!-- CLASS -->
                        <div>

                            <label class="block text-sm font-medium mb-2">
                                Class
                            </label>

                            <input type="text"
                                   id="class_name"
                                   placeholder="Example: CSE"
                                   class="w-full border rounded-lg px-4 py-3"
                                   required>

                        </div>


                        <!-- SECTION -->
                        <div>

                            <label class="block text-sm font-medium mb-2">
                                Section
                            </label>

                            <input type="text"
                                   id="section"
                                   placeholder="Example: A"
                                   class="w-full border rounded-lg px-4 py-3"
                                   required>

                        </div>


                        <!-- SUBJECT -->
                        <div>

                            <label class="block text-sm font-medium mb-2">
                                Subject
                            </label>

                            <input type="text"
                                   id="subject"
                                   placeholder="Example: DAA"
                                   class="w-full border rounded-lg px-4 py-3"
                                   required>

                        </div>


                        <!-- TEACHER -->
                        <div>

                            <label class="block text-sm font-medium mb-2">
                                Teacher
                            </label>

                            <select id="teacher_id"
                                    class="w-full border rounded-lg px-4 py-3"
                                    required>

                                <option value="">
                                    Loading teachers...
                                </option>

                            </select>

                        </div>

                    </div>


                    <button type="submit"
                            class="mt-6 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">

                        ➕ Add Lecture

                    </button>

                </form>

            </div>


            <!-- TIMETABLE -->
            <div class="bg-white rounded-xl shadow-sm mt-8">

                <div class="p-6 border-b">

                    <h3 class="text-xl font-bold text-gray-800">
                        Lecture Schedule
                    </h3>

                </div>


                <div class="overflow-x-auto">

                    <table class="w-full">

                        <thead class="bg-gray-50">

                            <tr>

                                <th class="text-left px-6 py-4">
                                    Day
                                </th>

                                <th class="text-left px-6 py-4">
                                    Time
                                </th>

                                <th class="text-left px-6 py-4">
                                    Class
                                </th>

                                <th class="text-left px-6 py-4">
                                    Subject
                                </th>

                                <th class="text-left px-6 py-4">
                                    Teacher
                                </th>

                                <th class="text-left px-6 py-4">
                                    Action
                                </th>

                            </tr>

                        </thead>

                        <tbody id="timetableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

    // ==========================================
    // LOAD TEACHERS
    // ==========================================

    async function loadTeachers() {

        try {

            const response = await fetch("/api/teachers");

            const teachers = await response.json();

            const select = document.getElementById("teacher_id");

            select.innerHTML =
                '<option value="">Select Teacher</option>';

            teachers.forEach(teacher => {

                const option = document.createElement("option");

                option.value = teacher._id;

                option.textContent = teacher.name;

                select.appendChild(option);

            });

        } catch (error) {

            console.error(error);

            alert("Failed to load teachers");

        }

    }


    // ==========================================
    // ADD LECTURE
    // ==========================================

    document
        .getElementById("timetableForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {

                day: document.getElementById("day").value,

                start_time:
                    document.getElementById("start_time").value,

                end_time:
                    document.getElementById("end_time").value,

                class_name:
                    document.getElementById("class_name").value,

                section:
                    document.getElementById("section").value,

                subject:
                    document.getElementById("subject").value,

                teacher_id:
                    document.getElementById("teacher_id").value

            };


            const response = await fetch("/api/timetable", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


            const result = await response.json();


            if (response.ok) {

                alert("Lecture added successfully!");

                document
                    .getElementById("timetableForm")
                    .reset();

                loadTimetable();

            } else {

                alert(result.message || "Failed to add lecture");

            }

        });


    // ==========================================
    // LOAD TIMETABLE
    // ==========================================

    async function loadTimetable() {

        try {

            const response = await fetch("/api/timetable");

            const timetable = await response.json();

            const tbody =
                document.getElementById("timetableBody");

            tbody.innerHTML = "";


            if (timetable.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="6"
                            class="text-center py-8 text-gray-500">
                            No lectures added yet.
                        </td>
                    </tr>
                `;

                return;

            }


            timetable.forEach(lecture => {

                const row = document.createElement("tr");

                row.className =
                    "border-t hover:bg-gray-50";


                row.innerHTML = `

                    <td class="px-6 py-4">
                        ${lecture.day}
                    </td>

                    <td class="px-6 py-4">
                        ${lecture.start_time}
                        -
                        ${lecture.end_time}
                    </td>

                    <td class="px-6 py-4">
                        ${lecture.class_name}
                        -
                        ${lecture.section}
                    </td>

                    <td class="px-6 py-4 font-medium">
                        ${lecture.subject}
                    </td>

                    <td class="px-6 py-4">
                        ${lecture.teacher_name}
                    </td>

                    <td class="px-6 py-4">

                        <button
                            onclick="deleteLecture('${lecture._id}')"
                            class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">

                            Delete

                        </button>

                    </td>

                `;


                tbody.appendChild(row);

            });

        } catch (error) {

            console.error(error);

            alert("Failed to load timetable");

        }

    }


    // ==========================================
    // DELETE LECTURE
    // ==========================================

    async function deleteLecture(id) {

        if (!confirm("Delete this lecture?")) {
            return;
        }


        const response =
            await fetch(`/api/timetable/${id}`, {
                method: "DELETE"
            });


        const result =
            await response.json();


        if (response.ok) {

            alert("Lecture deleted successfully!");

            loadTimetable();

        } else {

            alert(result.message || "Failed to delete lecture");

        }

    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadTeachers();

    loadTimetable();

</script>

</body>
</html>
