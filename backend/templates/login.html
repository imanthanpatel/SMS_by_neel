<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | School Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="text-4xl mb-3">
                🏫
            </div>

            <h1 class="text-2xl font-bold text-gray-800">
                School Management System
            </h1>

            <p class="text-gray-500 mt-2">
                Sign in to your account
            </p>

        </div>


        <!-- Error / Success Message -->
        <div id="message" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>


        <!-- Login Form -->
        <form id="loginForm">

            <!-- Email -->
            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input type="email" id="email" placeholder="Enter your email" required class="w-full border border-gray-300 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-blue-500">

            </div>


            <!-- Password -->
            <div class="mb-6">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>

                <input type="password" id="password" placeholder="Enter your password" required class="w-full border border-gray-300 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-blue-500">

            </div>


            <!-- Login Button -->
            <button type="submit" id="loginButton" class="w-full bg-blue-600 hover:bg-blue-700
                       text-white font-semibold py-3 rounded-lg
                       transition duration-200">
                Login
            </button>

        </form>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;


            loginButton.disabled = true;
            loginButton.innerText = "Logging in...";


            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


                const data = await response.json();


                if (response.ok) {

                    message.className =
                        "mb-4 p-3 rounded-lg text-sm text-center bg-green-100 text-green-700";

                    message.innerText =
                        "Login successful! Redirecting...";

                    message.classList.remove("hidden");


                    // Temporary role-based redirect
                    setTimeout(() => {

                        window.location.href =
                            "/dashboard/" + data.role;

                    }, 800);


                } else {

                    message.className =
                        "mb-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700";

                    message.innerText = data.message;

                    message.classList.remove("hidden");

                }

            } catch (error) {

                message.className =
                    "mb-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700";

                message.innerText =
                    "Something went wrong. Please try again.";

                message.classList.remove("hidden");

            }


            loginButton.disabled = false;
            loginButton.innerText = "Login";

        });
        window.location.href =
            "/dashboard/" + data.role;

    </script>

</body>

</html>
