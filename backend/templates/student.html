<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | School Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="min-h-screen">

    <!-- ================= NAVBAR ================= -->

    <nav class="bg-slate-900 text-white px-6 py-4
                flex justify-between items-center">

        <div>
            <h1 class="text-xl font-bold">
                School<span class="text-blue-400">MS</span>
            </h1>

            <p class="text-xs text-slate-400">
                School Management System
            </p>
        </div>

        <div class="flex items-center gap-4">

            <span class="text-sm">
                Admin
            </span>

            <a href="/logout"
               class="bg-red-600 hover:bg-red-700
                      px-4 py-2 rounded-lg text-sm">
                Logout
            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="p-6 max-w-7xl mx-auto">


        <!-- Header -->

        <div class="flex flex-col sm:flex-row
                    justify-between items-start sm:items-center
                    gap-4 mb-6">

            <div>

                <h2 class="text-3xl font-bold text-gray-800">
                    Students
                </h2>

                <p class="text-gray-500 mt-1">
                    Manage all students
                </p>

            </div>


            <button
                onclick="openAddModal()"
                class="bg-blue-600 hover:bg-blue-700
                       text-white px-5 py-3 rounded-lg
                       font-medium">

                + Add Student

            </button>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="bg-white rounded-xl shadow-sm p-4 mb-6">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by Student ID, name, email or class..."
                onkeyup="searchStudents()"
                class="w-full border border-gray-300
                       rounded-lg px-4 py-3
                       focus:outline-none
                       focus:ring-2 focus:ring-blue-500">

        </div>


        <!-- ================= TABLE ================= -->

        <div class="bg-white rounded-xl shadow-sm overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead class="bg-gray-50 border-b">

                        <tr>

                            <th class="text-left px-6 py-4
                                       text-sm font-semibold">
                                Student ID
                            </th>

                            <th class="text-left px-6 py-4
                                       text-sm font-semibold">
                                Name
                            </th>

                            <th class="text-left px-6 py-4
                                       text-sm font-semibold">
                                Email
                            </th>

                            <th class="text-left px-6 py-4
                                       text-sm font-semibold">
                                Class
                            </th>

                            <th class="text-left px-6 py-4
                                       text-sm font-semibold">
                                Phone
                            </th>

                            <th class="text-left px-6 py-4
                                       text-sm font-semibold">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="studentTable">

                        <tr>

                            <td colspan="6"
                                class="text-center px-6 py-10
                                       text-gray-500">

                                Loading students...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<!-- ================================================= -->
<!-- ADD / EDIT STUDENT MODAL -->
<!-- ================================================= -->

<div id="studentModal"
     class="hidden fixed inset-0 bg-black bg-opacity-50
            flex items-center justify-center p-4 z-50">


    <div class="bg-white rounded-xl shadow-xl
                w-full max-w-lg">


        <!-- Modal Header -->

        <div class="flex justify-between items-center
                    px-6 py-4 border-b">

            <div>

                <h3 id="modalTitle"
                    class="text-xl font-bold text-gray-800">

                    Add New Student

                </h3>

                <p id="modalSubtitle"
                   class="text-sm text-gray-500">

                    Enter student details

                </p>

            </div>


            <button
                onclick="closeModal()"
                class="text-gray-500 hover:text-gray-800
                       text-2xl">

                ×

            </button>

        </div>


        <!-- Form -->

        <form id="studentForm"
              class="p-6 space-y-4">


            <!-- Hidden ID -->

            <input type="hidden"
                   id="edit_id">


            <!-- Student ID -->

            <div>

                <label class="block text-sm font-medium mb-1">
                    Student ID
                </label>

                <input
                    type="text"
                    id="student_id"
                    placeholder="STU001"
                    required
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-2
                           focus:outline-none
                           focus:ring-2 focus:ring-blue-500">

            </div>


            <!-- Name -->

            <div>

                <label class="block text-sm font-medium mb-1">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Rahul Patel"
                    required
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-2
                           focus:outline-none
                           focus:ring-2 focus:ring-blue-500">

            </div>


            <!-- Email -->

            <div>

                <label class="block text-sm font-medium mb-1">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="student@example.com"
                    required
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-2
                           focus:outline-none
                           focus:ring-2 focus:ring-blue-500">

            </div>


            <!-- Phone -->

            <div>

                <label class="block text-sm font-medium mb-1">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="9876543210"
                    required
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-2
                           focus:outline-none
                           focus:ring-2 focus:ring-blue-500">

            </div>


            <!-- Class + Section -->

            <div class="grid grid-cols-2 gap-4">

                <div>

                    <label class="block text-sm font-medium mb-1">
                        Class
                    </label>

                    <input
                        type="text"
                        id="class_name"
                        placeholder="10"
                        required
                        class="w-full border border-gray-300
                               rounded-lg px-4 py-2
                               focus:outline-none
                               focus:ring-2 focus:ring-blue-500">

                </div>


                <div>

                    <label class="block text-sm font-medium mb-1">
                        Section
                    </label>

                    <input
                        type="text"
                        id="section"
                        placeholder="A"
                        required
                        class="w-full border border-gray-300
                               rounded-lg px-4 py-2
                               focus:outline-none
                               focus:ring-2 focus:ring-blue-500">

                </div>

            </div>


            <!-- Message -->

            <div id="formMessage"
                 class="text-sm">
            </div>


            <!-- Submit -->

            <button
                type="submit"
                id="submitButton"
                class="w-full bg-blue-600 hover:bg-blue-700
                       text-white py-3 rounded-lg
                       font-semibold">

                Save Student

            </button>

        </form>

    </div>

</div>


<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script>


// ====================================================
// OPEN ADD MODAL
// ====================================================

function openAddModal() {

    document.getElementById("studentForm").reset();

    document.getElementById("edit_id").value = "";

    document.getElementById("modalTitle").innerText =
        "Add New Student";

    document.getElementById("modalSubtitle").innerText =
        "Enter student details";

    document.getElementById("submitButton").innerText =
        "Save Student";

    document.getElementById("formMessage").innerHTML = "";

    document.getElementById("studentModal")
            .classList.remove("hidden");
}


// ====================================================
// CLOSE MODAL
// ====================================================

function closeModal() {

    document.getElementById("studentModal")
            .classList.add("hidden");

}


// ====================================================
// LOAD STUDENTS
// ====================================================

async function loadStudents() {

    try {

        const response =
            await fetch("/api/students");


        if (!response.ok) {

            throw new Error("Failed to load students");

        }


        const students =
            await response.json();


        const table =
            document.getElementById("studentTable");


        table.innerHTML = "";


        if (students.length === 0) {

            table.innerHTML = `

                <tr>

                    <td colspan="6"
                        class="text-center px-6 py-10
                               text-gray-500">

                        No students found.

                    </td>

                </tr>

            `;

            return;
        }


        students.forEach(student => {

            table.innerHTML += `

                <tr class="border-b hover:bg-gray-50">

                    <td class="px-6 py-4 text-sm font-medium">
                        ${student.student_id}
                    </td>


                    <td class="px-6 py-4 font-medium text-gray-800">
                        ${student.name}
                    </td>


                    <td class="px-6 py-4 text-sm text-gray-600">
                        ${student.email}
                    </td>


                    <td class="px-6 py-4 text-sm">

                        <span class="bg-blue-100 text-blue-700
                                     px-3 py-1 rounded-full text-xs">

                            ${student.class_name}
                            - ${student.section}

                        </span>

                    </td>


                    <td class="px-6 py-4 text-sm text-gray-600">
                        ${student.phone}
                    </td>


                    <td class="px-6 py-4">

                        <div class="flex gap-3">

                            <button
                                onclick='editStudent(${JSON.stringify(student)})'
                                class="text-blue-600
                                       hover:text-blue-800
                                       text-sm font-medium">

                                Edit

                            </button>


                            <button
                                onclick="deleteStudent('${student._id}')"
                                class="text-red-600
                                       hover:text-red-800
                                       text-sm font-medium">

                                Delete

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        });


    } catch (error) {

        console.error(error);

        document.getElementById("studentTable").innerHTML = `

            <tr>

                <td colspan="6"
                    class="text-center px-6 py-10
                           text-red-500">

                    Unable to load students.

                </td>

            </tr>

        `;

    }

}


// ====================================================
// ADD / UPDATE STUDENT
// ====================================================

document.getElementById("studentForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const editId =
            document.getElementById("edit_id").value;


        const student = {

            student_id:
                document.getElementById("student_id").value.trim(),

            name:
                document.getElementById("name").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            class_name:
                document.getElementById("class_name").value.trim(),

            section:
                document.getElementById("section").value.trim()

        };


        const isEditing = editId !== "";


        const url = isEditing
            ? `/api/students/${editId}`
            : "/api/students";


        const method = isEditing
            ? "PUT"
            : "POST";


        try {

            const response = await fetch(url, {

                method: method,

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(student)

            });


            const data =
                await response.json();


            if (response.ok) {

                document.getElementById("formMessage")
                    .innerHTML = `

                    <span class="text-green-600">

                        ${isEditing
                            ? "Student updated successfully!"
                            : "Student added successfully!"}

                    </span>

                `;


                await loadStudents();


                setTimeout(() => {

                    closeModal();

                }, 700);


            } else {

                document.getElementById("formMessage")
                    .innerHTML = `

                    <span class="text-red-600">

                        ${data.message || "Something went wrong"}

                    </span>

                `;

            }


        } catch (error) {

            console.error(error);

            document.getElementById("formMessage")
                .innerHTML = `

                <span class="text-red-600">

                    Server error. Please try again.

                </span>

            `;

        }

    });


// ====================================================
// EDIT STUDENT
// ====================================================

function editStudent(student) {

    document.getElementById("edit_id").value =
        student._id;


    document.getElementById("student_id").value =
        student.student_id;


    document.getElementById("name").value =
        student.name;


    document.getElementById("email").value =
        student.email;


    document.getElementById("phone").value =
        student.phone;


    document.getElementById("class_name").value =
        student.class_name;


    document.getElementById("section").value =
        student.section;


    document.getElementById("modalTitle").innerText =
        "Edit Student";


    document.getElementById("modalSubtitle").innerText =
        "Update student information";


    document.getElementById("submitButton").innerText =
        "Update Student";


    document.getElementById("formMessage").innerHTML = "";


    document.getElementById("studentModal")
            .classList.remove("hidden");

}


// ====================================================
// DELETE STUDENT
// ====================================================

async function deleteStudent(id) {

    const confirmed =
        confirm("Are you sure you want to delete this student?");


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(`/api/students/${id}`, {

                method: "DELETE"

            });


        const data =
            await response.json();


        if (response.ok) {

            await loadStudents();

        } else {

            alert(data.message || "Unable to delete student");

        }


    } catch (error) {

        console.error(error);

        alert("Server error. Please try again.");

    }

}


// ====================================================
// SEARCH STUDENTS
// ====================================================

function searchStudents() {

    const search =
        document.getElementById("searchInput")
                .value
                .toLowerCase();


    const rows =
        document.querySelectorAll("#studentTable tr");


    rows.forEach(row => {

        const text =
            row.innerText.toLowerCase();


        if (text.includes(search)) {

            row.style.display = "";

        } else {

            row.style.display = "none";

        }

    });

}


// ====================================================
// LOAD STUDENTS WHEN PAGE OPENS
// ====================================================

loadStudents();

</script>

</body>
</html>
