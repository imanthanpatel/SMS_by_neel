<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance History</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
            color: #333;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 230px;

            height: 100vh;

            background: #1f2937;

            color: white;

            padding: 25px 15px;
        }


        .sidebar h2 {

            text-align: center;

            margin-bottom: 35px;
        }


        .sidebar a {

            display: block;

            color: white;

            text-decoration: none;

            padding: 13px 15px;

            margin-bottom: 8px;

            border-radius: 6px;
        }


        .sidebar a:hover {

            background: #374151;
        }


        .sidebar a.active {

            background: #2563eb;
        }


        .logout {

            margin-top: 30px;

            background: #dc2626;

            text-align: center;
        }


        .logout:hover {

            background: #b91c1c !important;
        }



        /* =========================
           MAIN CONTENT
        ========================= */

        .main {

            margin-left: 230px;

            padding: 30px;
        }


        .header {

            background: white;

            padding: 25px;

            border-radius: 10px;

            margin-bottom: 25px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .header h1 {

            margin-bottom: 8px;
        }


        .header p {

            color: #666;
        }



        /* =========================
           TABLE SECTION
        ========================= */

        .section {

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .section h2 {

            margin-bottom: 20px;
        }


        .table-container {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;
        }


        th {

            background: #1f2937;

            color: white;

            padding: 14px;

            text-align: left;

            font-size: 14px;
        }


        td {

            padding: 14px;

            border-bottom: 1px solid #e5e7eb;

            font-size: 14px;
        }


        tr:hover {

            background: #f9fafb;
        }



        /* =========================
           STATUS BADGES
        ========================= */

        .present {

            color: #15803d;

            background: #dcfce7;

            padding: 6px 10px;

            border-radius: 20px;

            font-weight: bold;
        }


        .absent {

            color: #b91c1c;

            background: #fee2e2;

            padding: 6px 10px;

            border-radius: 20px;

            font-weight: bold;
        }



        /* =========================
           VIEW BUTTON
        ========================= */

        .view-btn {

            border: none;

            background: #2563eb;

            color: white;

            padding: 9px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;
        }


        .view-btn:hover {

            background: #1d4ed8;
        }



        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #777;
        }


        .empty h3 {

            margin-bottom: 8px;

            color: #444;
        }



        /* =========================
           MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background: rgba(0,0,0,0.55);

            padding: 40px 20px;

            overflow-y: auto;
        }


        .modal-content {

            background: white;

            max-width: 900px;

            margin: auto;

            border-radius: 10px;

            padding: 25px;

            position: relative;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.2);
        }


        .close-btn {

            position: absolute;

            right: 20px;

            top: 15px;

            border: none;

            background: #dc2626;

            color: white;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }


        .close-btn:hover {

            background: #b91c1c;
        }


        .modal-title {

            margin-bottom: 20px;

            padding-right: 50px;
        }


        .modal-title h2 {

            color: #2563eb;

            margin-bottom: 10px;
        }


        .lecture-details {

            background: #f3f4f6;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;
        }


        .lecture-details p {

            color: #555;
        }


        .students-table {

            width: 100%;

            border-collapse: collapse;
        }


        .students-table th {

            background: #374151;
        }


        .students-table td {

            border-bottom: 1px solid #ddd;
        }



        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {

                width: 100%;

                height: auto;

                position: relative;
            }


            .main {

                margin-left: 0;
            }


            .lecture-details {

                grid-template-columns: 1fr;
            }


            .modal {

                padding: 20px 10px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <h2>Teacher Panel</h2>


    <a href="/dashboard/teacher">
        Dashboard
    </a>


    <a href="#">
        My Lectures
    </a>


    <a href="/attendance-history" class="active">
        Attendance History
    </a>


    <a href="#">
        Students
    </a>


    <a href="/logout" class="logout">
        Logout
    </a>

</div>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="main">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Attendance History
        </h1>

        <p>
            View previously submitted attendance records.
        </p>

    </div>



    <!-- =========================
         HISTORY SECTION
    ========================= -->

    <div class="section">

        <h2>
            My Attendance Records
        </h2>


        <div id="historyContainer">

            <div class="empty">

                <h3>
                    Loading attendance...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </div>


</div>



<!-- =========================
     DETAILS MODAL
========================= -->

<div id="detailsModal" class="modal">


    <div class="modal-content">


        <button
            class="close-btn"
            onclick="closeModal()">

            ×

        </button>


        <div id="modalContent">

            Loading...

        </div>


    </div>

</div>



<script>


// =====================================================
// LOAD ATTENDANCE HISTORY
// =====================================================

async function loadAttendanceHistory() {


    const container =
        document.getElementById("historyContainer");


    try {


        const response =
            await fetch("/api/teacher/attendance-history");


        if (!response.ok) {

            throw new Error(
                "Failed to load attendance history"
            );

        }


        const records =
            await response.json();



        // =============================================
        // NO RECORDS
        // =============================================

        if (records.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        No Attendance Records
                    </h3>

                    <p>
                        You have not submitted any attendance yet.
                    </p>

                </div>

            `;

            return;
        }



        // =============================================
        // CREATE TABLE
        // =============================================

        let tableHTML = `

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Subject
                            </th>

                            <th>
                                Class
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Time
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Present
                            </th>

                            <th>
                                Absent
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;



        records.forEach(record => {


            tableHTML += `

                <tr>

                    <td>
                        <strong>
                            ${escapeHTML(record.subject)}
                        </strong>
                    </td>


                    <td>

                        ${escapeHTML(record.class_name)}
                        -
                        ${escapeHTML(record.section)}

                    </td>


                    <td>
                        ${escapeHTML(record.date)}
                    </td>


                    <td>
                        ${escapeHTML(record.start_time)}
                        -
                        ${escapeHTML(record.end_time)}
                    </td>


                    <td>
                        ${record.total_students}
                    </td>


                    <td>

                        <span class="present">

                            ${record.present}

                        </span>

                    </td>


                    <td>

                        <span class="absent">

                            ${record.absent}

                        </span>

                    </td>


                    <td>

                        <button
                            class="view-btn"
                            onclick="viewDetails('${record._id}')">

                            View Details

                        </button>

                    </td>

                </tr>

            `;

        });



        tableHTML += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML =
            tableHTML;


    }


    catch (error) {


        console.error(error);


        container.innerHTML = `

            <div class="empty">

                <h3>
                    Error Loading Attendance
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}



// =====================================================
// VIEW ATTENDANCE DETAILS
// =====================================================

async function viewDetails(attendanceId) {


    const modal =
        document.getElementById("detailsModal");


    const modalContent =
        document.getElementById("modalContent");


    modal.style.display = "block";


    modalContent.innerHTML = `

        <div class="empty">

            <h3>
                Loading...
            </h3>

        </div>

    `;



    try {


        const response =
            await fetch(
                "/api/teacher/attendance-history/"
                + attendanceId
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load details"
            );

        }


        const record =
            await response.json();



        // =============================================
        // CREATE STUDENT TABLE
        // =============================================

        let studentsHTML = "";


        record.students.forEach((student, index) => {


            const statusClass =
                student.status === "Present"
                    ? "present"
                    : "absent";


            studentsHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHTML(student.student_id)}
                    </td>

                    <td>
                        ${escapeHTML(student.student_name)}
                    </td>

                    <td>

                        <span class="${statusClass}">

                            ${escapeHTML(student.status)}

                        </span>

                    </td>

                </tr>

            `;

        });



        modalContent.innerHTML = `

            <div class="modal-title">

                <h2>
                    ${escapeHTML(record.subject)}
                </h2>

                <p>
                    Attendance Details
                </p>

            </div>


            <div class="lecture-details">

                <p>

                    <strong>
                        Class:
                    </strong>

                    ${escapeHTML(record.class_name)}
                    -
                    ${escapeHTML(record.section)}

                </p>


                <p>

                    <strong>
                        Date:
                    </strong>

                    ${escapeHTML(record.date)}

                </p>


                <p>

                    <strong>
                        Time:
                    </strong>

                    ${escapeHTML(record.start_time)}
                    -
                    ${escapeHTML(record.end_time)}

                </p>


                <p>

                    <strong>
                        Teacher:
                    </strong>

                    ${escapeHTML(record.teacher_name)}

                </p>

            </div>



            <div class="table-container">

                <table class="students-table">

                    <thead>

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Student ID
                            </th>

                            <th>
                                Student Name
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${studentsHTML}

                    </tbody>

                </table>

            </div>

        `;

    }


    catch (error) {


        console.error(error);


        modalContent.innerHTML = `

            <div class="empty">

                <h3>
                    Unable to Load Details
                </h3>

                <p>
                    Please try again.
                </p>

            </div>

        `;

    }

}



// =====================================================
// CLOSE MODAL
// =====================================================

function closeModal() {

    document.getElementById(
        "detailsModal"
    ).style.display = "none";

}



// =====================================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// =====================================================

window.onclick = function(event) {


    const modal =
        document.getElementById("detailsModal");


    if (event.target === modal) {

        closeModal();

    }

};



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    if (value === null || value === undefined) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



// =====================================================
// START
// =====================================================

loadAttendanceHistory();


</script>


</body>

</html>
