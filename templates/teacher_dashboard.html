<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #1f2937;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #374151;
        }

        .logout {
            margin-top: 30px;
            background: #dc2626;
            text-align: center;
        }

        .logout:hover {
            background: #b91c1c !important;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .main {
            margin-left: 230px;
            padding: 30px;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }


        /* =========================
           STAT CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }


        /* =========================
           LECTURES
        ========================= */

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .lecture {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lecture:last-child {
            margin-bottom: 0;
        }

        .lecture-info h3 {
            margin-bottom: 8px;
            color: #2563eb;
        }

        .lecture-info p {
            margin: 5px 0;
            color: #555;
        }

        .lecture-time {
            font-weight: bold;
            color: #111;
        }

        .attendance-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .attendance-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           EMPTY MESSAGE
        ========================= */

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main {
                margin-left: 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .lecture {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }
    </style>

</head>


<body>


    <!-- =========================
     SIDEBAR
========================= -->

    <div class="sidebar">

        <h2>Teacher Panel</h2>

        <a href="/dashboard/teacher">
            Dashboard
        </a>

        <a href="#">
            My Lectures
        </a>

        <a href="/attendance-history">
            Attendance History
        </a>

        <a href="#">
            Students
        </a>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>



    <!-- =========================
     MAIN
========================= -->

    <div class="main">


        <!-- HEADER -->

        <div class="header">

            <h1>
                Welcome, <span id="teacherName">Teacher</span> 👋
            </h1>

            <p>
                Here you can view your scheduled lectures and take attendance.
            </p>

        </div>



        <!-- =========================
         CARDS
    ========================= -->

        <div class="cards">

            <div class="card">

                <h3>
                    Total Lectures
                </h3>

                <div class="number" id="totalLectures">
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Classes
                </h3>

                <div class="number" id="totalClasses">
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Subjects
                </h3>

                <div class="number" id="totalSubjects">
                    0
                </div>

            </div>

        </div>



        <!-- =========================
         LECTURE SECTION
    ========================= -->

        <div class="section">

            <h2>
                My Scheduled Lectures
            </h2>

            <div id="lectureContainer">

                <div class="empty">
                    Loading lectures...
                </div>

            </div>

        </div>


    </div>



    <script>


        // =====================================================
        // LOAD TEACHER NAME
        // =====================================================

        async function loadTeacherInfo() {

            try {

                const response = await fetch("/api/teacher/timetable");

                if (!response.ok) {

                    throw new Error("Unable to load teacher data");

                }

                const lectures = await response.json();


                // Teacher name comes from timetable
                if (lectures.length > 0) {

                    document.getElementById("teacherName").textContent =
                        lectures[0].teacher_name;

                }

            }

            catch (error) {

                console.error(error);

            }

        }



        // =====================================================
        // LOAD TEACHER TIMETABLE
        // =====================================================

        async function loadLectures() {

            const container =
                document.getElementById("lectureContainer");


            try {

                const response =
                    await fetch("/api/teacher/timetable");


                if (!response.ok) {

                    throw new Error("Failed to load lectures");

                }


                const lectures =
                    await response.json();


                // =========================
                // UPDATE STATISTICS
                // =========================

                document.getElementById("totalLectures")
                    .textContent = lectures.length;


                const classes = new Set();

                const subjects = new Set();


                lectures.forEach(lecture => {

                    classes.add(
                        lecture.class_name + " " + lecture.section
                    );

                    subjects.add(
                        lecture.subject
                    );

                });


                document.getElementById("totalClasses")
                    .textContent = classes.size;


                document.getElementById("totalSubjects")
                    .textContent = subjects.size;



                // =========================
                // NO LECTURES
                // =========================

                if (lectures.length === 0) {

                    container.innerHTML = `
            
                <div class="empty">
                    <h3>No lectures scheduled</h3>
                    <p>
                        Admin has not assigned any lectures to you yet.
                    </p>
                </div>

            `;

                    return;

                }



                // =========================
                // DISPLAY LECTURES
                // =========================

                container.innerHTML = "";


                lectures.forEach(lecture => {

                    const lectureDiv =
                        document.createElement("div");

                    lectureDiv.className = "lecture";


                    lectureDiv.innerHTML = `

                <div class="lecture-info">

                    <h3>
                        ${lecture.subject}
                    </h3>

                    <p>
                        <strong>Class:</strong>
                        ${lecture.class_name}
                        - ${lecture.section}
                    </p>

                    <p>
                        <strong>Day:</strong>
                        ${lecture.day}
                    </p>

                    <p class="lecture-time">
                        ${lecture.start_time}
                        -
                        ${lecture.end_time}
                    </p>

                </div>


                <div>

                    <button
                        class="attendance-btn"
                        onclick="takeAttendance('${lecture._id}')">

                        Take Attendance

                    </button>

                </div>

            `;


                    container.appendChild(
                        lectureDiv
                    );

                });

            }

            catch (error) {

                console.error(error);


                container.innerHTML = `

            <div class="empty">

                <h3>
                    Error loading lectures
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

            }

        }



        // =====================================================
        // TAKE ATTENDANCE
        // =====================================================

        function takeAttendance(lectureId) {

            window.location.href =
                "/attendance/" + lectureId;

        }



        // =====================================================
        // START
        // =====================================================

        loadTeacherInfo();

        loadLectures();


    </script>


</body>

</html>
