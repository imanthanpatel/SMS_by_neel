<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Take Attendance</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
            color: #333;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .header h1 {
            margin-bottom: 10px;
            color: #1f2937;
        }


        .header p {
            color: #666;
            margin: 5px 0;
        }


        /* =========================
           BUTTON
        ========================= */

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #374151;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }


        .back-btn:hover {
            background: #1f2937;
        }


        .submit-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 20px;
        }


        .submit-btn:hover {
            background: #1d4ed8;
        }


        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }


        /* =========================
           ATTENDANCE BOX
        ========================= */

        .attendance-box {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .attendance-box h2 {
            margin-bottom: 20px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-container {
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
        }


        th {
            background: #1f2937;
            color: white;
            padding: 14px;
            text-align: left;
        }


        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }


        tr:hover {
            background: #f9fafb;
        }


        /* =========================
           STATUS BUTTONS
        ========================= */

        .status-buttons {
            display: flex;
            gap: 8px;
        }


        .status-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            background: #e5e7eb;
            color: #333;
        }


        .status-btn.present.active {
            background: #16a34a;
            color: white;
        }


        .status-btn.absent.active {
            background: #dc2626;
            color: white;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }


        .success {
            background: #dcfce7;
            color: #166534;
        }


        .error {
            background: #fee2e2;
            color: #991b1b;
        }


        .warning {
            background: #fef3c7;
            color: #92400e;
        }


        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }


        .summary-card {
            background: #f9fafb;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }


        .summary-card strong {
            font-size: 20px;
            margin-left: 5px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .main {
                padding: 15px;
            }


            th,
            td {
                padding: 10px;
                font-size: 14px;
            }


            .status-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="main">


    <!-- =========================
         BACK
    ========================= -->

    <a
        href="/dashboard/teacher"
        class="back-btn">

        ← Back to Dashboard

    </a>



    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>
            Take Attendance
        </h1>


        <p>
            <strong>Subject:</strong>

            <span id="subject">
                Loading...
            </span>
        </p>


        <p>
            <strong>Class:</strong>

            <span id="className">
                Loading...
            </span>
        </p>


        <p>
            <strong>Time:</strong>

            <span id="time">
                Loading...
            </span>
        </p>


        <p>
            <strong>Date:</strong>

            <span id="attendanceDate">
                Loading...
            </span>
        </p>

    </div>



    <!-- =========================
         MESSAGE
    ========================= -->

    <div
        id="message"
        class="message">

    </div>



    <!-- =========================
         ATTENDANCE
    ========================= -->

    <div class="attendance-box">


        <h2>
            Student Attendance
        </h2>



        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">

                Total:

                <strong id="totalStudents">
                    0
                </strong>

            </div>


            <div class="summary-card">

                Present:

                <strong id="presentCount">
                    0
                </strong>

            </div>


            <div class="summary-card">

                Absent:

                <strong id="absentCount">
                    0
                </strong>

            </div>

        </div>



        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Student ID
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Attendance
                        </th>

                    </tr>

                </thead>


                <tbody id="studentTable">

                    <tr>

                        <td
                            colspan="4"
                            class="loading">

                            Loading students...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>



        <!-- SUBMIT -->

        <button
            id="submitButton"
            class="submit-btn"
            onclick="submitAttendance()">

            Submit Attendance

        </button>


    </div>


</div>



<script>


// =====================================================
// LECTURE ID
// =====================================================

const lectureId =
    "{{ lecture_id }}";


// =====================================================
// STUDENTS
// =====================================================

let students = [];


// =====================================================
// TODAY'S DATE
// =====================================================

function getTodayDate() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;

}


document.getElementById(
    "attendanceDate"
).textContent =
    getTodayDate();



// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";

}



// =====================================================
// LOAD STUDENTS
// =====================================================

async function loadStudents() {

    const table =
        document.getElementById(
            "studentTable"
        );


    try {

        const response =
            await fetch(
                `/api/attendance/${lectureId}/students`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load students"
            );

        }


        // =========================
        // LECTURE INFORMATION
        // =========================

        document.getElementById(
            "subject"
        ).textContent =
            data.lecture.subject;


        document.getElementById(
            "className"
        ).textContent =
            `${data.lecture.class_name} - ${data.lecture.section}`;


        document.getElementById(
            "time"
        ).textContent =
            `${data.lecture.start_time} - ${data.lecture.end_time}`;



        // =========================
        // STUDENTS
        // =========================

        students =
            data.students.map(
                student => ({

                    ...student,

                    status: "Present"

                })
            );


        // =========================
        // CHECK EXISTING
        // =========================

        if (data.attendance_exists) {

            showMessage(

                "Attendance has already been submitted for this lecture today.",

                "warning"

            );


            document.getElementById(
                "submitButton"
            ).disabled = true;

        }


        displayStudents();

        updateSummary();


    }

    catch (error) {

        console.error(error);


        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="loading">

                    ${error.message}

                </td>

            </tr>

        `;

    }

}



// =====================================================
// DISPLAY STUDENTS
// =====================================================

function displayStudents() {

    const table =
        document.getElementById(
            "studentTable"
        );


    table.innerHTML = "";


    if (students.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="loading">

                    No students found for this class.

                </td>

            </tr>

        `;

        return;

    }


    students.forEach(
        (student, index) => {


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>


                <td>
                    ${student.student_id}
                </td>


                <td>
                    ${student.name}
                </td>


                <td>

                    <div class="status-buttons">

                        <button
                            class="status-btn present ${
                                student.status === "Present"
                                    ? "active"
                                    : ""
                            }"
                            onclick="setAttendance(
                                ${index},
                                'Present'
                            )">

                            Present

                        </button>


                        <button
                            class="status-btn absent ${
                                student.status === "Absent"
                                    ? "active"
                                    : ""
                            }"
                            onclick="setAttendance(
                                ${index},
                                'Absent'
                            )">

                            Absent

                        </button>

                    </div>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}



// =====================================================
// SET ATTENDANCE
// =====================================================

function setAttendance(
    index,
    status
) {

    students[index].status =
        status;


    displayStudents();

    updateSummary();

}



// =====================================================
// UPDATE SUMMARY
// =====================================================

function updateSummary() {

    const total =
        students.length;


    const present =
        students.filter(
            student =>
                student.status === "Present"
        ).length;


    const absent =
        students.filter(
            student =>
                student.status === "Absent"
        ).length;


    document.getElementById(
        "totalStudents"
    ).textContent =
        total;


    document.getElementById(
        "presentCount"
    ).textContent =
        present;


    document.getElementById(
        "absentCount"
    ).textContent =
        absent;

}



// =====================================================
// SUBMIT ATTENDANCE
// =====================================================

async function submitAttendance() {

    const button =
        document.getElementById(
            "submitButton"
        );


    if (students.length === 0) {

        showMessage(
            "There are no students to mark attendance.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to submit attendance?"
        );


    if (!confirmed) {

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "Submitting...";


    const attendanceData =
        students.map(
            student => ({

                student_id:
                    student.student_id,

                status:
                    student.status

            })
        );


    try {

        const response =
            await fetch(
                "/api/attendance",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        lecture_id:
                            lectureId,

                        date:
                            getTodayDate(),

                        attendance:
                            attendanceData

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to submit attendance"
            );

        }


        showMessage(
            "Attendance submitted successfully!",
            "success"
        );


        button.textContent =
            "Attendance Submitted";


        // Disable attendance buttons
        document
            .querySelectorAll(
                ".status-btn"
            )
            .forEach(
                btn => {
                    btn.disabled = true;
                }
            );


        alert(
            "Attendance submitted successfully!"
        );


    }

    catch (error) {

        console.error(error);


        showMessage(
            error.message,
            "error"
        );


        button.disabled =
            false;


        button.textContent =
            "Submit Attendance";

    }

}



// =====================================================
// START
// =====================================================

loadStudents();


</script>


</body>

</html>
